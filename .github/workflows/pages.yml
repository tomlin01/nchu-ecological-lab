name: Publish static website to GitHub Pages

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website source
        uses: actions/checkout@v6
      - name: Test project-path validation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test homepage image loading
        run: node --test scripts/test_home_image_loading.cjs
      - name: Verify static files and project-path dependencies
        run: python3 scripts/verify_site.py
      - name: Configure existing GitHub Pages settings
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
